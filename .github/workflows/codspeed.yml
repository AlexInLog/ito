name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main" 
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONAN_HOME: "${{ github.workspace }}/release/"
  # Bumped when the runner image changes: the cache keys don't include the image version, and packages built on one
  # Ubuntu release (glibc/libstdc++) can't be reused on another.
  HASH_NUMBER : 2

jobs:
  benchmarks:
    name: Run benchmarks (${{ matrix.mode }})
    # Pinned: ubuntu-latest moved to 26.04, which CodSpeed's runner doesn't support yet ("Unsupported system").
    runs-on: ubuntu-24.04
    permissions: # optional for public repositories
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, walltime]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build cache
        uses: actions/cache@v5
        with:
          path: |
            ./build/
            ~/vcpkg
            ~/.cache/vcpkg/archives
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
            ${{ env.APPDATA }}/vcpkg/archives
            ${{ env.XDG_CACHE_HOME }}/vcpkg/archives
            ~/.cache/ccache
            ~/.ccache
            ~/.config/ccache
            ~/Library/Caches/ccache
            ${{ env.LOCALAPPDATA }}/ccache
            ${{ env.XDG_CACHE_HOME }}/ccache
          key: ${{ runner.os }}-deps-benchmark-${{ matrix.mode }}-${{ hashFiles('**/conanfile.py') }}-${{ hashFiles('**/CMakePresets.json') }}-${{ env.HASH_NUMBER }}

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          conan: true
          ccache: true

      - name: check conan cache
        uses: actions/cache@v5
        id: check_cache
        with:
          path: ${{ env.CONAN_HOME }}
          key: deps-benchmark-${{ matrix.mode }}-${{ hashFiles('**/conanfile.py') }}-${{ hashFiles('**/CMakePresets.json') }}-${{ env.HASH_NUMBER }}

      - name: conan detect profile
        run: |
          conan profile detect --force

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: codspeed-${{ matrix.mode }}
          buildPreset: build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: ${{ matrix.mode }}
          run: ./build/bin/ito_benchmarks
