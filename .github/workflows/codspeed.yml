name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONAN_HOME: "${{ github.workspace }}/release/"
  # Bumped when the runner image changes: the cache keys don't include the image version, and packages built on one
  # Ubuntu release (glibc/libstdc++) can't be reused on another.
  HASH_NUMBER : 2
  # Only ccache's directory is cached between runs, not ./build/: a checkout gives every source a new mtime, so ninja
  # rebuilds everything anyway, and a restored build tree would bring a stale CMakeCache.txt.
  # Keyed by commit so every run saves a fresh cache (an exact key hit never saves), restored from the newest one.
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_MAXSIZE: 500M

jobs:
  benchmarks:
    name: Run benchmarks (${{ matrix.mode }})
    # Pinned: ubuntu-latest moved to 26.04, which CodSpeed's runner doesn't support yet ("Unsupported system").
    runs-on: ubuntu-24.04
    permissions: # optional for public repositories
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, walltime]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-benchmark-${{ matrix.mode }}-${{ github.sha }}
          restore-keys: ccache-benchmark-${{ matrix.mode }}-

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          conan: true
          ccache: true

      - name: check conan cache
        uses: actions/cache@v6
        id: check_cache
        with:
          path: ${{ env.CONAN_HOME }}
          key: deps-benchmark-${{ matrix.mode }}-${{ hashFiles('**/conanfile.py') }}-${{ hashFiles('**/CMakePresets.json') }}-${{ env.HASH_NUMBER }}

      - name: conan detect profile
        run: |
          conan profile detect --force

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: codspeed-${{ matrix.mode }}
          buildPreset: build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          run: ./build/bin/ito_benchmarks
