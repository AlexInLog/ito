name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # safe default for tests/coverage jobs and PR runs

env:
  CONAN_HOME: "${{ github.workspace }}/release/"
  # Bumped when a runner image changes: the cache keys don't include the image version, and packages built on one
  # OS release can't be reused on another. Images are pinned below rather than *-latest so they only change on purpose.
  HASH_NUMBER : 2
  # Only ccache's directory is cached between runs, not ./build/: a checkout gives every source a new mtime, so ninja
  # rebuilds everything anyway, and a restored build tree would bring a stale CMakeCache.txt and stale coverage profiles.
  # Keyed by commit so every run saves a fresh cache (an exact key hit never saves), restored from the newest one.
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_MAXSIZE: 500M

jobs:
  tests:
    strategy:
      matrix:
        config:
        - { name: lint-ubuntu-gcc,   os: ubuntu-26.04,  compiler: gcc,          lint: true,  configurePreset: lint,            testPreset: tests }
        - { name: lint-ubuntu-clang, os: ubuntu-26.04,  compiler: llvm,         lint: true,  configurePreset: lint,            testPreset: tests  }
        - { name: tests-windows,     os: windows-2025-vs2026, compiler: msvc,         lint: false, configurePreset: debug-tests,     testPreset: tests   }
        - { name: lint-macos,        os: macos-26,        compiler: apple-clang,  lint: true,  configurePreset: lint,            testPreset: tests   }
        - { name: release-ubuntu-gcc, os: ubuntu-26.04, compiler: gcc,          lint: false, configurePreset: release-tests,   testPreset: tests      }
        - { name: sanitize-asan-gcc, os: ubuntu-26.04,  compiler: gcc,          lint: false, configurePreset: sanitize-asan,   testPreset: sanitize   }
        - { name: sanitize-tsan,     os: ubuntu-26.04,  compiler: llvm,         lint: false, configurePreset: sanitize-tsan,   testPreset: sanitize   }
        - { name: sanitize-asan,     os: ubuntu-26.04,  compiler: llvm,         lint: false, configurePreset: sanitize-asan,   testPreset: sanitize   }
        - { name: sanitize-lsan,     os: ubuntu-26.04,  compiler: llvm,         lint: false, configurePreset: sanitize-lsan,   testPreset: sanitize   }
        - { name: sanitize-ubsan,    os: ubuntu-26.04,  compiler: llvm,         lint: false, configurePreset: sanitize-ubsan,  testPreset: sanitize   }

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: ccache
        if: ${{ !startsWith(matrix.config.os, 'windows') }} # no ccache on the MSVC job
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.config.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.config.name }}-

      - name: Setup Cpp
        if: ${{ !startsWith(matrix.config.os, 'windows') }}
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.config.compiler }}
          cmake: true
          ninja: true
          ccache: true
          clang-tidy: ${{ matrix.config.lint }}
          cppcheck: ${{ matrix.config.lint }}

      - uses: actions/setup-python@v7
        with: { python-version: "3.14.10" }

      - name: get conan
        run: pip install conan

      - name: check conan cache
        uses: actions/cache@v6
        id: check_cache
        with:
            path: ${{ env.CONAN_HOME }}
            key: deps-tests-${{ matrix.config.name }}-${{ hashFiles('**/conanfile.py') }}-${{ hashFiles('**/CMakePresets.json') }}-${{ env.HASH_NUMBER}}

      - name: conan detect profile
        run: |
          conan profile detect --force

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.config.configurePreset }}
          buildPreset: build
          testPreset: ${{ matrix.config.testPreset }}
        env:
          VCPKG_ROOT: ''

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          conan: true
          ccache: true

      - name: check conan cache
        uses: actions/cache@v6
        id: check_cache
        with:
            path: ${{ env.CONAN_HOME }}
            key: deps-coverage--${{ hashFiles('**/conanfile.py') }}-${{ hashFiles('**/CMakePresets.json') }}-${{ env.HASH_NUMBER}}

      - name: conan detect profile
        run: |
          conan profile detect --force

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: coverage
          buildPreset: build
          testPreset: tests

      - name: Process coverage info
        run: cmake --build build -t coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=build/compile_commands.json
