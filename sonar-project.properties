sonar.projectKey=AlexInLog_ito
sonar.organization=victimsnino

sonar.projectName=ito
sonar.projectVersion=0.0

sonar.sources=include,tests
sonar.coverage.exclusions=tests/**/*
sonar.cpd.exclusions=tests/**/*
sonar.sourceEncoding=UTF-8

sonar.cfamily.llvm-cov.reportPath=build/test_results/coverage.txt

sonar.issue.ignore.allfile=a1
sonar.issue.ignore.allfile.a1.fileRegexp=#include.*catch2
sonar.cfamily.compile-commands=build/compile_commands.json

# cpp:S836 ("undefined or garbage value returned") on outcome::get_result() is a false positive: when a test moves a
# future<int> before awaiting it, the analyzer loses track of the result variant through trackable's defaulted move
# and treats the int as uninitialized. Index 1 is only ever set by emplace<1>, which initializes it. Scoped to this
# rule and file so it survives the code moving within it (marking it in the UI doesn't); see docs/ideas.md.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S836
sonar.issue.ignore.multicriteria.e1.resourceKey=**/include/ito/details/utils/outcome.hpp
